<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>CameraShots</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CameraShots">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: #000; color: #fff; font: 16px system-ui, sans-serif; overflow: hidden; touch-action: manipulation; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  #finder { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  #finder.ready::after { content: ""; position: absolute; inset: 0; border: 3px solid #ffd21f; pointer-events: none; }
  video, #outline { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #status { position: absolute; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top)); text-align: center; text-shadow: 0 1px 3px #000, 0 0 8px #000; }
  #bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); }
  #map { width: 96px; height: 60px; }
  button { font: inherit; color: #000; background: #fff; border: 0; border-radius: 10px; padding: 12px 20px; min-height: 48px; }
  #shutter { grid-column: 2; width: 72px; height: 72px; border-radius: 50%; padding: 0; border: 5px solid #000; outline: 3px solid #fff; background: #fff; }
  #shutter:disabled { background: #555; outline-color: #555; }
  #shutter:active:not(:disabled) { background: #ffd21f; }
  #result { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; }
  #result div { display: flex; gap: 10px; justify-content: center; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
  #result p { margin: 0; padding: 10px; text-align: center; }
  #shot { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
</style>
<div id="finder">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="outline"></canvas>
  <div id="status" role="status">Starting…</div>
</div>
<div id="bar">
  <canvas id="map" aria-hidden="true"></canvas>
  <button id="shutter" aria-label="Take screenshot" disabled></button>
</div>
<div id="result" hidden>
  <p id="copied"></p>
  <img id="shot" alt="Screenshot">
  <div>
    <button id="again">Back</button>
    <button id="share">Share</button>
  </div>
</div>
<script src="cv.js"></script>
<script src="aruco.js"></script>
<script src="region.js"></script>
<script src="app.js"></script>
</html>

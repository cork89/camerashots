<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Pair CameraShots</title>
<link rel="icon" href="data:image/x-icon;base64,__ICON__">
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; color: #111; background: #fff; }
  #qr { margin: 1.5rem 0; }
  #qr svg { width: 280px; height: 280px; }
</style>
<h1>Pair your phone</h1>
<p>Scan this with your phone:</p>
<div id="qr"></div>
<p>Your phone must be connected to your Tailscale network.</p>
<p>It opens <b>__URL__</b>. Anyone with this code can capture your screen. Use <b>Reset pairing</b> in the tray menu to revoke it.</p>
<script>/*QRCODE_JS*/</script>
<script>
  var qr = qrcode(0, 'M');
  qr.addData('__URL__/#t=__TOKEN__');
  qr.make();
  document.getElementById('qr').innerHTML = qr.createSvgTag({ scalable: true, margin: 4 });
</script>
</html>
